name: zizmor

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/zizmor.yml"]
  pull_request:
    paths: [".github/workflows/**", ".github/zizmor.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -e GH_TOKEN -v "$PWD":/repo:ro -w /repo "$ZIZMOR_IMAGE" --format=sarif --no-exit-codes .github/workflows > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - run: docker run --rm -e GH_TOKEN -v "$PWD":/repo:ro -w /repo "$ZIZMOR_IMAGE" --format=github .github/workflows
